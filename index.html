<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta>
        <meta>
        <meta>
        <link rel="stylesheet" href="style.css">
        <title>Vortex Logistic</title>
    </head>
    <body>
        <header>
            <span class="logo">Vortex</span>
            <div class="nav-inner">
                <nav>
                    <a class="link" href="">Главная</a>
                    <a class="link" href="">Услуги</a>
                    <a class="link" href="">Тарифы</a>
                </nav>
                <button class="btn-header">Связаться</button>
            </div>
        </header>
        <section class="hero">
            <div class="container">
                <div class="hero-left">
                    <h1 class="hero-title">Быстрая и надежная доставка</h1>
                    <p class="hero-subtitle">Доставляем ваши посылки быстро, безопасно и точно в срок по всему миру</p>
                    <button class="btn-primary">Узнать больше</button>
                    <button class="btn-secondary">Отследить посылку</button>
                </div>
                <div class="hero-right">
                    
                </div>
            </div>
        </section>
        <section class="digits">
            <h2 class="digits-title">Наши цифры</h2>
            <div class="container-digits">
                <label class="number-card" for="">
                    <span class="number-digit">4000+</span>
                    <div class="card-divider"></div>
                    <span class="number-text">Довольных клиентов</span>
                </label>
                <label class="number-card" for="">
                    <span class="number-digit">20+</span>
                    <div class="card-divider"></div>
                    <span class="number-text">Стран охвата</span>
                </label>
                <label class="number-card" for="">
                    <span class="number-digit">10+</span>
                    <div class="card-divider"></div>
                    <span class="number-text">Лет опыта работы</span>
                </label>
                <label class="number-card" for="">
                    <span class="number-digit">100%</span>
                    <div class="card-divider"></div>
                    <span class="number-text">Гарантия доставки</span>
                </label>
            </div>
        </section>
    </body>
</html>
